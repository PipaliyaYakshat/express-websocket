<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        #messages {
            border: 1px solid #ccc;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 20px;
            background: #f9f9f9;
        }

        .message {
            margin-bottom: 10px;
            padding: 8px;
            background: white;
            border-radius: 4px;
        }

        .message-header {
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
        }

        .message-content {
            color: #666;
        }

        .message-time {
            font-size: 0.8em;
            color: #999;
        }

        input,
        button {
            padding: 10px;
            margin: 5px;
        }

        input[type="text"] {
            width: 60%;
        }

        button {
            cursor: pointer;
        }

        #status {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .connected {
            background: #d4edda;
            color: #155724;
        }

        .disconnected {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>
    <h1>WebSocket Chat Example (Native WebSocket)</h1>

    <div id="status" class="disconnected">Disconnected</div>

    <div>
        <input type="text" id="tokenInput" placeholder="Enter JWT Token" style="width: 100%; margin-bottom: 10px;">
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
    </div>

    <div>
        <input type="text" id="receiverInput" placeholder="Receiver user ID (for 1-to-1 chat)" style="width: 100%;">
    </div>

    <div id="messages"></div>

    <div>
        <input type="text" id="messageInput" placeholder="Type your message...">
        <button onclick="sendMessage()">Send</button>
        <button onclick="loadHistory()">Load History</button>
    </div>

    <div>
        <input type="text" id="deleteInput" placeholder="Message ID to delete">
        <button onclick="deleteMessage()">Delete Message</button>
    </div>

    <script>
        let ws = null;
        let currentConversationUserId = null;

        function connect() {
            const token = document.getElementById('tokenInput').value;

            if (!token) {
                alert('Please enter a JWT token');
                return;
            }

            // Disconnect existing connection if any
            if (ws) {
                ws.close();
            }

            // Connect to WebSocket server
            // Token can be passed as query parameter
            const wsUrl = `ws://localhost:3000/ws?token=${encodeURIComponent(token)}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                updateStatus('Connected', true);
                console.log('Connected to WebSocket server');
            };

            ws.onclose = () => {
                updateStatus('Disconnected', false);
                console.log('Disconnected from WebSocket server');
            };

            ws.onerror = (error) => {
                updateStatus('Connection Error', false);
                console.error('WebSocket error:', error);
                alert('Connection error occurred');
            };

            ws.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    handleMessage(message);
                } catch (error) {
                    console.error('Error parsing message:', error);
                }
            };
        }

        function handleMessage(message) {
            const { type, data } = message;

            switch (type) {
                case 'connected':
                    addSystemMessage('Successfully connected');
                    if (data.user) {
                        addSystemMessage(`Logged in as: ${data.user.username}`);
                    }
                    break;

                case 'receive_message':
                    addMessage(data);
                    break;

                case 'message_deleted':
                    addSystemMessage(`Message ${data.messageId} has been deleted`);
                    // Optionally remove the message from UI
                    const messageElement = document.getElementById(`msg-${data.messageId}`);
                    if (messageElement) {
                        messageElement.style.opacity = '0.5';
                        messageElement.style.textDecoration = 'line-through';
                    }
                    break;

                case 'message_history':
                    const messagesDiv = document.getElementById('messages');
                    messagesDiv.innerHTML = '';
                    data.messages.forEach(msg => {
                        addMessage(msg, false);
                    });
                    break;

                case 'error':
                    console.error('Server error:', data);
                    alert('Error: ' + data.message);
                    break;

                default:
                    console.log('Unknown message type:', type, data);
            }
        }

        function sendWebSocketMessage(type, payload) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type, payload }));
            } else {
                alert('WebSocket is not connected');
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
                updateStatus('Disconnected', false);
            }
        }

        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const content = messageInput.value.trim();
            const receiverId = document.getElementById('receiverInput').value.trim();

            if (!content) {
                alert('Please enter a message');
                return;
            }

            if (!receiverId) {
                alert('Please enter a receiver user ID');
                return;
            }

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Please connect first');
                return;
            }

            currentConversationUserId = receiverId;

            sendWebSocketMessage('send_message', {
                content: content,
                receiverId: receiverId
            });

            messageInput.value = '';
        }

        function deleteMessage() {
            const messageId = document.getElementById('deleteInput').value.trim();

            if (!messageId) {
                alert('Please enter a message ID');
                return;
            }

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Please connect first');
                return;
            }

            sendWebSocketMessage('delete_message', {
                messageId: messageId
            });

            document.getElementById('deleteInput').value = '';
        }

        function loadHistory() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Please connect first');
                return;
            }

            const receiverId = document.getElementById('receiverInput').value.trim();
            if (!receiverId) {
                alert('Please enter a receiver user ID to load conversation');
                return;
            }

            currentConversationUserId = receiverId;

            sendWebSocketMessage('get_messages', {
                withUserId: receiverId,
                limit: 50
            });
        }

        function addMessage(data, scroll = true) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.id = `msg-${data._id}`;

            const time = new Date(data.createdAt).toLocaleTimeString();

            messageDiv.innerHTML = `
                <div class="message-header">${data.sender.username || 'Unknown'}</div>
                <div class="message-content">${data.content}</div>
                <div class="message-time">${time}</div>
            `;

            messagesDiv.appendChild(messageDiv);

            if (scroll) {
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }

        function addSystemMessage(message) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.style.fontStyle = 'italic';
            messageDiv.style.color = '#666';
            messageDiv.textContent = `[System] ${message}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateStatus(message, connected) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = connected ? 'connected' : 'disconnected';
        }

        // Allow sending message with Enter key
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>

</html>
